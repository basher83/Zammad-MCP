# Canary for #392. The pinned runner gives Renovate a runner update to propose, so we can observe
# which checks gate automerge. Keep the version pinned; do not switch it to ubuntu-latest.
# On Renovate branches the job waits five minutes, so it finishes after the required checks. If an
# automerge PR merges while this check is still running, GitHub-native auto-merge decided the merge.
name: Runner Canary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  runner-canary:
    runs-on: ubuntu-26.04
    if: github.repository == 'basher83/Zammad-MCP'
    steps:
      - name: Report runner image
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          grep PRETTY_NAME /etc/os-release
      - name: Outlast required checks on Renovate branches
        if: startsWith(github.head_ref, 'renovate/')
        run: sleep 300
