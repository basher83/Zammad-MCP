name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.repository == 'basher83/Zammad-MCP'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python and uv from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.7"
          install_args: python uv

      - name: Restore uv cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: uv-validate-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run canonical release validation
        run: ./scripts/validate.sh release

      - name: Prune uv cache before it is saved
        run: uv cache prune --ci

  tests:
    # Same gates as `scripts/validate.sh release` tests: full suite with the
    # coverage floor from pyproject.toml, plus report artifacts.
    runs-on: ubuntu-latest
    if: github.repository == 'basher83/Zammad-MCP'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    env:
      # Each leg tests its own interpreter. uv installs it when it is missing.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.7"
          install_args: uv
          # The mise environment sets UV_PYTHON to the pinned 3.13 interpreter
          # and would override the matrix value, so do not export it.
          env: false
          export_path: false
          add_shims_to_path: false

      - name: Put the pinned uv on PATH
        run: dirname "$(mise which uv)" >> "$GITHUB_PATH"

      - name: Restore uv cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: uv-tests-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Check that the leg runs the requested interpreter
        run: |
          actual="$(uv run --frozen python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          if [ "$actual" != "$UV_PYTHON" ]; then
            echo "::error::matrix leg $UV_PYTHON runs Python $actual. Something overrides UV_PYTHON: a .python-version file, or the mise environment exported by mise-action (keep env: false and export_path: false in this job). See #387."
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          # Run pytest with coverage in XML format for Codacy
          uv run pytest tests/ \
            --cov=mcp_zammad \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov

      - name: Check Codacy token availability
        id: codacy_token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codacy
        # Coverage upload is reporting, not validation. Dependabot and fork PRs
        # may not have repository secrets, so skip cleanly when the token is not
        # present and keep the required test job focused on tests/coverage.
        if: >-
          github.event_name != 'workflow_dispatch' &&
          matrix.python-version == '3.13' &&
          steps.codacy_token.outputs.available == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
          language: python

      - name: Upload coverage reports as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-reports-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f coverage.xml ]; then
            # Parse coverage.xml to extract percentage
            COVERAGE=$(uv run python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.get('line-rate', 0)) * 100; print(f'{coverage:.1f}')" | tr -d '\n')
            
            echo "### Overall Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Coverage badge
            # The floor comes from pyproject.toml ([tool.coverage.report] fail_under), the gate's source of truth
            FLOOR=$(sed -n 's/^fail_under = //p' pyproject.toml)
            COVERAGE=$COVERAGE FLOOR=$FLOOR uv run python -c "import os; cov = float(os.environ['COVERAGE']); floor = float(os.environ['FLOOR']); print(f'✅ **Status**: Meets coverage target ({floor:g}%)' if cov >= floor else f'❌ **Status**: Below coverage target ({floor:g}%)')" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📈 Coverage details available in [Codacy](https://app.codacy.com/gh/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prune uv cache before it is saved
        run: uv cache prune --ci

  test-and-coverage:
    # Aggregate check: the main ruleset requires this exact context, which the
    # matrix job names (tests (3.10), ...) never satisfy on their own.
    needs: [tests, validate]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require validate and every matrix test job to succeed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$TESTS_RESULT" != "success" ] || [ "$VALIDATE_RESULT" != "success" ]; then
            echo "tests result: $TESTS_RESULT; validate result: $VALIDATE_RESULT" >&2
            exit 1
          fi
